<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Break Timer</title>
<meta name="description" content="Time your work breaks and get back on time.">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Theme before first paint (no flash): the user's saved choice, else the system setting.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('breakCalc.theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<style>
  /* Theme tokens: light by default; [data-theme="dark"] (system setting or the user's choice) switches every color. */
  :root {
    color-scheme: light;
    --page-bg: #eef0f4;
    --card-bg: #ffffff;
    --card-shadow: rgba(20, 30, 60, 0.12);
    --panel-top: #f8f9fb;
    --panel-bottom: #f0f2f6;
    --line: #e1e4ea;
    --text: #0d0f13;
    --text-2: #16181e;
    --muted: #3d4250;
    --faint: #5f6473;
    --surface: #eef0f4;
    --surface-press: #e2e5eb;
    --ring-track: #e3e6ec;
    --ring-sec-track: #e9ecf1;
    --wheel-band: rgba(20, 30, 60, 0.07);
    --accent: #4470ea;
    --accent-press: #3a62d6;
    --accent-soft: #3a62d6;
    --red: #e5484d;
    --orange: #f08c00;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #1b1c20;
    --card-bg: #26272c;
    --card-shadow: rgba(0, 0, 0, 0.4);
    --panel-top: #151515;
    --panel-bottom: #0a0a0a;
    --line: #3a3b40;
    --text: #ffffff;
    --text-2: #e4e4e7;
    --muted: #c9c9cc;
    --faint: #8b8c92;
    --surface: #33353b;
    --surface-press: #3d3f46;
    --ring-track: #2c2d32;
    --ring-sec-track: #1f2024;
    --wheel-band: rgba(255, 255, 255, 0.08);
    --accent-soft: #8fa8f5;
  }

  .corner-btn {
    position: absolute;
    top: 12px;
    width: 36px; height: 36px;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    color: var(--text);
    background-color: var(--surface);
    -webkit-border-radius: 50%; border-radius: 50%;
    -webkit-transition: -webkit-transform 0.1s, background-color 0.2s;
    transition: transform 0.1s, background-color 0.2s;
  }
  .corner-btn.left { left: 12px; }
  .corner-btn.right { right: 12px; }
  .corner-btn.left2 { left: 56px; }
  .corner-btn[hidden] { display: none; }
  .corner-btn:active { -webkit-transform: scale(0.92); transform: scale(0.92); background-color: var(--surface-press); }
  .theme-btn .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-btn .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: start; -webkit-justify-content: flex-start; justify-content: flex-start;
    /* No gap above the card; only the phone's notch/status-bar area is kept clear. */
    padding: 0 16px 20px;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background-color: var(--page-bg);
    -webkit-transition: background-color 0.3s, color 0.3s;
    transition: background-color 0.3s, color 0.3s;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 400px; /* mobile-only app: same phone layout on tablets and laptops */
    overflow: hidden;
    background-color: var(--card-bg);
    -webkit-border-radius: 32px;
    border-radius: 32px;
    -webkit-box-shadow: 0 20px 50px var(--card-shadow);
    box-shadow: 0 20px 50px var(--card-shadow);
  }

  button { font: inherit; cursor: pointer; border: none; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, .wheel-col:focus-visible { outline: 2px solid #6b8ff0; outline-offset: 2px; }

  /* ---------- Top timeline panel ---------- */
  .panel {
    position: relative;
    padding: 16px 0 14px;
    background-color: var(--panel-bottom);
    background-image: -webkit-linear-gradient(top, var(--panel-top), var(--panel-bottom));
    background-image: linear-gradient(to bottom, var(--panel-top), var(--panel-bottom));
    border-bottom: 1px solid var(--line);
  }

  .status {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
  }

  .status-row {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    gap: 10px;
  }
  .live-dot {
    display: none;
    position: relative;
    width: 10px; height: 10px;
    background-color: #4caf50;
    -webkit-border-radius: 50%; border-radius: 50%;
  }
  .live-dot::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    -webkit-border-radius: 50%; border-radius: 50%;
    background-color: #4caf50;
    -webkit-animation: ping 1.4s ease-out infinite;
    animation: ping 1.4s ease-out infinite;
  }
  @-webkit-keyframes ping { from { -webkit-transform: scale(1); opacity: 0.7; } to { -webkit-transform: scale(2.8); opacity: 0; } }
  @keyframes ping { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.8); opacity: 0; } }

  /* ---------- Progress ring ---------- */
  .ring-wrap {
    position: relative;
    width: 150px; height: 150px;
    margin: 8px auto 0;
  }
  .ring { display: block; width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 14; }
  .ring-sec-track { fill: none; stroke: var(--ring-sec-track); stroke-width: 2; }
  .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 14;
    stroke-linecap: round;
    -webkit-transition: stroke-dashoffset 1s linear, stroke 0.6s;
    transition: stroke-dashoffset 1s linear, stroke 0.6s;
  }
  /* Rotating layers: the progress head and the seconds sweep */
  .ring-head, .ring-sec {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    pointer-events: none;
  }
  .ring-head {
    -webkit-transition: -webkit-transform 1s linear;
    transition: transform 1s linear;
  }
  .ring-head span, .ring-sec span {
    position: absolute;
    left: 50%;
    -webkit-border-radius: 50%; border-radius: 50%;
    background-color: #ffffff;
  }
  .ring-head span { top: calc(6.36% - 7px); width: 14px; height: 14px; margin-left: -7px; }
  .ring-sec span { top: calc(13.64% - 4px); width: 8px; height: 8px; margin-left: -4px; background-color: var(--accent-soft); }
  .ring-center {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  }
  .ring-big {
    font-size: 1.9rem;
    font-weight: 800;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    -webkit-transition: color 0.6s;
    transition: color 0.6s;
  }
  .ring-small { margin-top: 4px; font-size: 0.8rem; color: var(--muted); }

  .ring-times {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    max-width: 360px;
    margin: 6px auto 0;
    padding: 0 20px;
  }
  .ring-times > div { text-align: center; min-width: 76px; }
  .tl-pct { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
  .tl-label { font-size: 0.82rem; color: var(--muted); }
  .tl-time { margin-top: 2px; min-height: 1.3em; font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Running: live dot, glowing head, seconds dot sweeping once a minute */
  .running .live-dot { display: block; }
  .running .ring-head, .running .ring-sec { display: block; }
  .running .ring-head span {
    -webkit-animation: glow 1.4s ease-in-out infinite;
    animation: glow 1.4s ease-in-out infinite;
  }
  .running .ring-sec {
    -webkit-animation: spin 60s linear infinite;
    animation: spin 60s linear infinite;
  }
  @-webkit-keyframes spin { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @-webkit-keyframes glow { 0%, 100% { -webkit-box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.5); } 50% { -webkit-box-shadow: 0 0 14px 6px rgba(143, 168, 245, 0.85); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.5); } 50% { box-shadow: 0 0 14px 6px rgba(143, 168, 245, 0.85); } }

  /* Light warning ("start wrapping up"): everything that was blue turns orange */
  .caution .status,
  .caution .ring-big { color: var(--orange); }
  .caution .ring-fill { stroke: var(--orange); }
  .caution .ring-sec span { background-color: #f8c27a; }
  .caution .live-dot,
  .caution .live-dot::after { background-color: var(--orange); }

  /* Heavy warning ("head back now"): red */
  .warning .status,
  .warning .ring-big { color: var(--red); }
  .warning .ring-fill { stroke: var(--red); }
  .warning .ring-sec span { background-color: #f5a3a3; }
  .warning .live-dot,
  .warning .live-dot::after { background-color: var(--red); }
  .warning .ring-head span { -webkit-animation-name: glowRed; animation-name: glowRed; }
  @-webkit-keyframes glowRed { 0%, 100% { -webkit-box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.5); } 50% { -webkit-box-shadow: 0 0 14px 6px rgba(245, 120, 120, 0.9); } }
  @keyframes glowRed { 0%, 100% { box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.5); } 50% { box-shadow: 0 0 14px 6px rgba(245, 120, 120, 0.9); } }

  /* ---------- Controls ---------- */
  .controls { padding: 22px 20px; }
  .ctl-label { display: block; margin-bottom: 12px; font-size: 0.95rem; font-weight: 700; color: var(--text-2); }

  .label-row {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: start; -webkit-align-items: flex-start; align-items: flex-start;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
  }
  .now-btn {
    display: -webkit-inline-box; display: -webkit-inline-flex; display: inline-flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    gap: 6px;
    height: 36px;
    margin-top: -9px;
    padding: 0 16px;
    font-size: 0.95rem;
    font-weight: 700;
    color: #ffffff;
    background-color: var(--accent);
    -webkit-border-radius: 18px; border-radius: 18px;
    -webkit-box-shadow: 0 4px 12px rgba(68, 112, 234, 0.35);
    box-shadow: 0 4px 12px rgba(68, 112, 234, 0.35);
    -webkit-transition: -webkit-transform 0.1s, background-color 0.2s;
    transition: transform 0.1s, background-color 0.2s;
  }
  .now-btn:active { -webkit-transform: scale(0.95); transform: scale(0.95); background-color: var(--accent-press); }

  /* Wheel time picker */
  .wheel {
    --row: 36px;
    position: relative;
    display: -webkit-box; display: -webkit-flex; display: flex;
    height: calc(var(--row) * 3);
    padding: 0 6px;
    background-color: var(--surface);
    -webkit-border-radius: 12px; border-radius: 12px;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .wheel::before {
    content: "";
    position: absolute;
    left: 6px; right: 6px;
    top: calc(var(--row) * 1);
    height: var(--row);
    background-color: var(--wheel-band);
    -webkit-border-radius: 8px; border-radius: 8px;
    pointer-events: none;
  }
  .wheel-col {
    -webkit-box-flex: 1; -webkit-flex: 1 1 0; flex: 1 1 0;
    height: 100%;
    padding: calc(var(--row) * 1) 0;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    -webkit-scroll-snap-type: y mandatory;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -webkit-mask-image: -webkit-linear-gradient(top, transparent, #000 30%, #000 70%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
    -webkit-border-radius: 8px; border-radius: 8px;
  }
  .wheel-col::-webkit-scrollbar { display: none; }
  .wheel-item {
    height: var(--row);
    line-height: var(--row);
    text-align: center;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    scroll-snap-align: center;
    cursor: pointer;
    -webkit-transition: color 0.15s;
    transition: color 0.15s;
  }
  .wheel-item.sel { color: var(--text); font-weight: 700; }
  .wheel-sep {
    -webkit-align-self: center; align-self: center;
    font-size: 1.15rem; font-weight: 700;
    color: var(--text);
    position: relative;
  }

  .chips {
    display: -webkit-box; display: -webkit-flex; display: flex;
    gap: 8px;
  }
  .chip {
    -webkit-box-flex: 1; -webkit-flex: 1 1 0; flex: 1 1 0;
    height: 36px;
    font-size: 0.9rem;
    font-weight: 700;
    white-space: nowrap;
    background-color: var(--surface);
    border: 1px solid transparent;
    -webkit-border-radius: 18px; border-radius: 18px;
    -webkit-transition: background-color 0.2s, border-color 0.2s;
    transition: background-color 0.2s, border-color 0.2s;
  }
  .chip:active { background-color: var(--surface-press); }
  .chip.active { border-color: var(--accent); color: var(--accent-soft); }

  .slider-block { margin-top: 26px; }
  .time-block { margin-top: 26px; }
  .slider-row {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    gap: 16px;
  }
  .slider-value {
    -webkit-flex-shrink: 0; flex-shrink: 0;
    min-width: 64px;
    text-align: right;
    font-size: 1rem;
    font-weight: 700;
  }

  input[type="range"] {
    --pct: 0%;
    -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
    min-width: 0;
    height: 4px;
    margin: 14px 0;
    background-color: var(--line);
    background-image: -webkit-linear-gradient(left, var(--accent) var(--pct), transparent var(--pct));
    background-image: linear-gradient(to right, var(--accent) var(--pct), transparent var(--pct));
    -webkit-border-radius: 2px; border-radius: 2px;
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px;
    background-color: var(--accent);
    border: none;
    -webkit-border-radius: 50%; border-radius: 50%;
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px; height: 26px;
    background-color: var(--accent);
    border: none;
    border-radius: 50%;
  }
  input[type="range"]::-moz-range-progress { background-color: var(--accent); height: 4px; border-radius: 2px; }

  .action-row {
    display: -webkit-box; display: -webkit-flex; display: flex;
    gap: 10px;
    margin-top: 26px;
  }
  .start-btn {
    -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
    min-width: 0;
    height: 50px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #ffffff;
    background-color: var(--accent);
    -webkit-border-radius: 25px; border-radius: 25px;
    -webkit-transition: -webkit-transform 0.12s, background-color 0.2s;
    transition: transform 0.12s, background-color 0.2s;
  }
  .start-btn:active { -webkit-transform: scale(0.98); transform: scale(0.98); background-color: var(--accent-press); }
  .start-btn.stop { background-color: #d64545; }
  .start-btn.stop:active { background-color: #bb3a3a; }
  /* Clears the current break (running or stopped) back to "Ready to start" */
  .cancel-btn {
    -webkit-flex-shrink: 0; flex-shrink: 0;
    height: 50px;
    padding: 0 20px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    background-color: var(--surface);
    -webkit-border-radius: 25px; border-radius: 25px;
    -webkit-transition: -webkit-transform 0.12s, background-color 0.2s;
    transition: transform 0.12s, background-color 0.2s;
  }
  .cancel-btn:active { -webkit-transform: scale(0.97); transform: scale(0.97); background-color: var(--surface-press); }
  .cancel-btn[hidden] { display: none; }

  .summary {
    margin-top: 8px;
    text-align: center;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .summary[hidden] { display: none; }

  .save-row {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    gap: 10px;
    margin-top: 22px;
    padding-top: 18px;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
  }
  .save-row.notify-row { margin-top: 0; padding-top: 10px; }
  .save-row[hidden] { display: none; }
  .save-row input {
    width: 20px; height: 20px;
    -webkit-flex-shrink: 0; flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* ---------- Walkthrough ---------- */
  .tour { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none; }
  /* Invisible tap blockers around the spotlight; the hole one is removed on "tap this" steps */
  .tour-block { position: absolute; pointer-events: auto; }
  .tour-block[hidden] { display: none; }
  .tour[hidden] { display: none; }
  /* The spotlight: a rounded hole, everything around it dimmed by a huge shadow */
  .tour-spot {
    position: absolute;
    -webkit-border-radius: 16px; border-radius: 16px;
    -webkit-box-shadow: 0 0 0 9999px rgba(8, 10, 16, 0.62);
    box-shadow: 0 0 0 9999px rgba(8, 10, 16, 0.62);
    -webkit-transition: top 0.25s, left 0.25s, width 0.25s, height 0.25s;
    transition: top 0.25s, left 0.25s, width 0.25s, height 0.25s;
    pointer-events: none;
  }
  .tour-card {
    position: absolute;
    pointer-events: auto;

    max-width: 360px;
    margin: 0 auto;
    padding: 16px 16px 12px;

    -webkit-border-radius: 18px; border-radius: 18px;
    -webkit-box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);

    -webkit-transition: top 0.25s; transition: top 0.25s;
  }
  .tour-step { font-size: 0.75rem; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
  .tour-title { margin-top: 4px; font-size: 1.05rem; font-weight: 800; }
  .tour-text { margin-top: 6px; font-size: 0.9rem; line-height: 1.45; color: var(--muted); }
  .tour-actions {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .tour-spacer { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .tour-skip, .tour-back {
    height: 36px; padding: 0 12px;
    font-size: 0.9rem; font-weight: 700;
    color: var(--muted);
    background-color: transparent;
    -webkit-border-radius: 18px; border-radius: 18px;
  }
  .tour-back { color: var(--text); background-color: var(--surface); }
  .tour-back[hidden], .tour-next[hidden] { display: none; }
  .tour-hint { font-size: 0.85rem; font-weight: 700; color: var(--accent); }
  .tour-hint[hidden] { display: none; }
  .tour-next {
    height: 36px; padding: 0 18px;
    font-size: 0.9rem; font-weight: 700;
    color: #ffffff;
    background-color: var(--accent);
    -webkit-border-radius: 18px; border-radius: 18px;
  }
  .tour-next:active { background-color: var(--accent-press); }

  /* ---------- Install banner ---------- */
  .install {
    position: fixed;
    left: 50%;
    top: max(12px, env(safe-area-inset-top));

<script>
(function () {
  'use strict';

  var STATE_KEY = 'breakCalc.state';
  var MIN = 60 * 1000;

  var $ = function (id) { return document.getElementById(id); };
  var durationInput = $('duration');
  var chips = document.querySelectorAll('.chip');
  var startBtn = $('startBtn');
  var autoStopToggle = $('autoStopToggle');
  var wheelEl = $('wheel');

  // duration: minutes. start: ms when the break started, or null before one is started.
  // stopped: ms when Stop was pressed, or null while the break is live.
  var state = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  // 12-hour clock for every displayed time, e.g. "5:42 PM".
  function hhmm(ms) {
    var d = new Date(ms), h = d.getHours();
    return (h % 12 || 12) + ':' + pad(d.getMinutes()) + (h < 12 ? ' AM' : ' PM');
  }

  // ---------- Storage (guarded: may be blocked on file:// or in private mode) ----------
  function readStore(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function writeStore(key, val) { try { window.localStorage.setItem(key, val); } catch (e) {} }
  function removeStore(key) { try { window.localStorage.removeItem(key); } catch (e) {} }

  // The running break is always kept so a refresh doesn't lose it.
  function save() {
    writeStore(STATE_KEY, JSON.stringify(state));
  }

  function load() {
    try {
      var s = JSON.parse(readStore(STATE_KEY));
      if (s && s.duration >= 1 && s.duration <= 120) {
        var start = typeof s.start === 'number' ? s.start : null;
        var stopped = start !== null && typeof s.stopped === 'number' ? s.stopped : null;
        return { duration: s.duration, start: start, stopped: stopped };
      }
    } catch (e) {}
    return null;
  }

  // ---------- Wheel picker ----------
  function Wheel(el, labels, onChange) {
    var self = this;
    this.el = el;
    this.labels = labels;
    this.index = 0;
    var timer = null;
    labels.forEach(function (text, i) {
      var item = document.createElement('div');
      item.className = 'wheel-item';
      item.textContent = text;
      item.addEventListener('click', function () { self.set(i, true); onChange(true); });
      el.appendChild(item);
    });
    el.addEventListener('scroll', function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        var i = Math.round(el.scrollTop / self.rowHeight());
        if (i !== self.index) { self.mark(i); onChange(false); }
      }, 90);
    });
    el.addEventListener('keydown', function (e) {
      var step = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      self.set(Math.max(0, Math.min(labels.length - 1, self.index + step)), true);
      onChange(true);
    });
  }
  Wheel.prototype.rowHeight = function () { return this.el.firstChild.offsetHeight || 36; };
  Wheel.prototype.mark = function (i) {
    var items = this.el.children;
    if (items[this.index]) items[this.index].classList.remove('sel');
    this.index = Math.max(0, Math.min(this.labels.length - 1, i));
    items[this.index].classList.add('sel');
    this.el.setAttribute('aria-valuetext', this.labels[this.index]);
  };
  Wheel.prototype.set = function (i, smooth) {
    this.mark(i);
    var top = this.index * this.rowHeight();
    if (smooth && this.el.scrollTo) this.el.scrollTo({ top: top, behavior: 'smooth' });
    else this.el.scrollTop = top;
  };

  function range(n, from, fmt) { var a = []; for (var i = 0; i < n; i++) a.push(fmt(i + from)); return a; }

  // The wheel follows the clock until the user moves it.
  var wheelTouched = false;
  function onWheelChange(byUser) { if (byUser) wheelTouched = true; render(); }

  var hourWheel = new Wheel($('colHour'), range(12, 1, String), onWheelChange);
  var minWheel = new Wheel($('colMin'), range(60, 0, pad), onWheelChange);
  var periodWheel = new Wheel($('colPeriod'), ['AM', 'PM'], onWheelChange);

  ['touchstart', 'pointerdown', 'wheel', 'keydown'].forEach(function (ev) {
    wheelEl.addEventListener(ev, function () { wheelTouched = true; }, { passive: true });
  });

  function setWheel(ms) {
    var d = new Date(ms);
    hourWheel.set((d.getHours() % 12 || 12) - 1);
    minWheel.set(d.getMinutes());
    periodWheel.set(d.getHours() < 12 ? 0 : 1);
  }

  function wheelTime() {
    var h = (hourWheel.index + 1) % 12 + periodWheel.index * 12;
    var m = minWheel.index;
    var now = new Date();
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
    // Picked 11:50 PM just after midnight: the break started yesterday.
    if (d.getTime() - now.getTime() > 12 * 60 * MIN) d.setDate(d.getDate() - 1);
    return d.getTime();
  }

  // ---------- Rendering ----------
  function fmtSecs(secs) {
    var m = Math.floor(secs / 60), s = secs % 60;
    if (!m && s) return s + 's';
    return s ? m + 'm ' + s + 's' : m + ' min';
  }
  // Rounded so remaining + elapsed always add up to the full duration.
  function fmtRemaining(ms) { return fmtSecs(Math.ceil(ms / 1000)); }
  function fmtElapsed(ms) { return fmtSecs(Math.floor(ms / 1000)); }

  var cardEl = document.querySelector('.card');
  function setRunning(running, titleText) {
    if (running && !cardEl.classList.contains('running')) {
      // Start the seconds sweep where the break's current minute is, so it ticks in step.
      var delay = '-' + (((Date.now() - state.start) / 1000) % 60).toFixed(2) + 's';
      $('ringSec').style.webkitAnimationDelay = delay;
      $('ringSec').style.animationDelay = delay;
    }
    cardEl.classList.toggle('running', running);
    // Countdown in the tab title too, visible from the browser's tab switcher.
    document.title = running ? titleText + ' · Break Timer' : 'Break Timer';
  }

  var lastMinute = -1;
  // Warning lead times (time left when each stage starts), for a break of `minutes`:
  //   red    ("head back now")      = min(25% of the break, 0.8 × √minutes), at most 8 min
  //   orange ("start wrapping up")  = min(40% of the break, 2 × red)
  // Getting back to your desk takes about the same time whatever the break length, so the
  // lead grows slowly (√) instead of in proportion; the % caps keep short breaks sensible.
  // e.g. 5 min → 2:00 / 1:15 · 15 → 6:00 / 3:00 · 60 → 12:30 / 6:15 · 120 → 16:00 / 8:00
  // Rounded to 15 s so notifications read cleanly. The notifications use the same points.
  function warningLeads(minutes) {
    var red = Math.min(minutes * 0.25, 0.8 * Math.sqrt(minutes), 8);
    var orange = Math.min(minutes * 0.4, 2 * red);
    var round15 = function (min) { return Math.max(15, Math.round(min * 60 / 15) * 15) * 1000; };
    return { caution: round15(orange), warn: round15(red) };
  }
  var lastPhase = null; // 'ok' | 'caution' | 'warn' | 'over' for the live break, null otherwise

  // ---------- Sounds (generated with Web Audio, so they work offline) ----------
  var audioCtx = null;
  function unlockAudio() {
    // Browsers only allow sound after a real tap/click (touchstart and touch pointerdown don't count),
    // so create/resume the audio engine only on events that grant that permission.
    var ua = navigator.userActivation;
    if (ua && !ua.isActive) return;
    if (audioCtx && audioCtx.state === 'running') return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  ['click', 'pointerup', 'touchend', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, unlockAudio, true);
  });

  function tone(freq, startAt, length, volume, type) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    // Short fade in/out avoids clicks.
    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(volume, startAt + 0.02);
    gain.gain.setValueAtTime(volume, startAt + length - 0.03);
    gain.gain.linearRampToValueAtTime(0, startAt + length);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startAt);
    osc.stop(startAt + length);
  }

  // Break over: longer and louder alarm (~3 s of alternating tones), used only without notifications.
  function playEnd() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + 0.05;
    for (var i = 0; i < 10; i++) {
      tone(i % 2 ? 740 : 988, t + i * 0.3, 0.25, 0.7, 'square');
    }
  }

  function render() {
    var now = Date.now();
    var total = state.duration * MIN;

    // With no live break (none yet, or the last one stopped) the wheel follows the clock,
    // so the next Start begins now unless the user picks another time.
    if ((state.start === null || state.stopped !== null) && !wheelTouched) {
      var minute = Math.floor(now / MIN);
      if (minute !== lastMinute) { lastMinute = minute; setWheel(now); }
    }

    if (state.start === null) {
      setRunning(false);
      // Times stay hidden until a break starts.
      $('status').textContent = 'Ready to start';
      $('tlStart').textContent = $('tlEnd').textContent = $('elapsed').textContent = '';
      setProgress(0, total);
      setButton('Start Break', false);
      $('summary').hidden = true;
      cardEl.classList.remove('caution', 'warning');
      lastPhase = null;
      return;
    }

    // A stopped break is frozen at the moment Stop was pressed.
    var stopped = state.stopped !== null;
    var at = stopped ? state.stopped : now;
    var end = state.start + total;
    var elapsed = Math.max(0, Math.min(total, at - state.start));
    var over = elapsed >= total;
    $('status').textContent = stopped ? 'Break stopped' : over ? 'Break over' : (at < state.start ? 'Break not started yet' : 'On break');
    $('tlStart').textContent = hhmm(state.start);
    $('tlEnd').textContent = hhmm(end);
    // Past the end the clock keeps counting: elapsed and percent go beyond the plan,
    // and the ring center counts the overtime up.
    var actual = Math.max(0, at - state.start);
    var overMs = actual - total;
    setProgress(elapsed / total * 100, total - elapsed);
    $('elapsed').textContent = fmtElapsed(actual);
    $('percent').textContent = Math.round(actual / total * 100) + '%';
    if (overMs >= 1000) {
      $('ringBig').textContent = '+' + fmtClock(overMs, true);
      $('ringSmall').textContent = 'over';
    }
    setRunning(!stopped && at >= state.start, over ? '+' + fmtElapsed(overMs) + ' over' : fmtRemaining(total - elapsed));

    // Orange, then red as the end gets close (see warningLeads) until the break is stopped;
    // notifications mark those points, and the alarm rings at the end for phones without them.
    var live = !stopped && at >= state.start;
    var leads = warningLeads(state.duration);
    var left = total - elapsed;
    var warn = live && left <= leads.warn;
    var caution = live && !warn && left <= leads.caution;
    cardEl.classList.toggle('caution', caution);
    cardEl.classList.toggle('warning', warn);
    var phase = !live ? null : over ? 'over' : warn ? 'warn' : caution ? 'caution' : 'ok';
    // Only a change seen while the page is open sounds; loading mid-phase stays quiet.
    // The app stays silent when notifications are on; the alarm is only the fallback without them.
    if (lastPhase && phase && phase !== lastPhase && phase === 'over' && !notificationsOn()) playEnd();
    lastPhase = phase;

    // Auto-stop: end the break exactly at its end time, logging the planned duration.
    if (live && over && autoStopToggle.checked) {
      stopBreak(end);
      render();
      return;
    }
    // Safety net when auto-stop is off: a break left running to twice its length is
    // stopped at that point, so a forgotten timer doesn't count overtime forever.
    if (live && actual >= 2 * total) {
      stopBreak(state.start + 2 * total);
      render();
      return;
    }
    setButton(stopped ? 'Start New Break' : 'Stop Break', !stopped);

    $('summary').hidden = !stopped;
    if (stopped) {
      // Actual time away, not capped at the planned duration.
      var taken = Math.max(0, state.stopped - state.start);
      var extra = taken - total;
      $('summary').textContent = 'You took ' + fmtElapsed(taken) +
        (extra >= 1000 ? ' · ' + fmtElapsed(extra) + ' over' : ' · ' + fmtRemaining(total - taken) + ' left') +
        (taken === 2 * total ? ' · stopped automatically' : '');
    }
  }

  function setButton(text, isStop) {
    startBtn.textContent = text;
    startBtn.classList.toggle('stop', isStop);
    $('cancelBtn').hidden = state.start === null;
  }

  var RING_LEN = 2 * Math.PI * 96; // circumference of the progress circle (r=96)
  var ringFill = $('ringFill');
  ringFill.style.strokeDasharray = RING_LEN;
  ringFill.style.strokeDashoffset = RING_LEN; // start empty, then fill to the current value

  // Countdowns round up (never show 0:00 early); count-ups round down.
  function fmtClock(ms, countUp) {
    var secs = countUp ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
    return Math.floor(secs / 60) + ':' + pad(secs % 60);
  }

  function setProgress(pct, remainingMs) {
    ringFill.style.strokeDashoffset = RING_LEN * (1 - pct / 100);
    var head = 'rotate(' + (pct * 3.6) + 'deg)';
    $('ringHead').style.webkitTransform = head;
    $('ringHead').style.transform = head;
    $('ringBig').textContent = fmtClock(remainingMs);
    $('ringSmall').textContent = 'remaining';
    $('track').setAttribute('aria-valuenow', Math.round(pct));
    // Percent shows only while a break exists, next to the elapsed time.
    $('percent').textContent = state.start === null ? '' : Math.round(pct) + '%';
  }

  function stopBreak(at) {
    state.stopped = at;
    save();
    cancelEndNotification();
    // Release the wheel from this break's start time so a new break doesn't reuse it.
    wheelTouched = false;
    lastMinute = -1;
  }

  function renderDuration() {
    var v = state.duration;
    durationInput.value = v;
    $('durationValue').textContent = v + ' min';
    durationInput.style.setProperty('--pct', ((v - 1) / 119 * 100) + '%');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('active', +chips[i].getAttribute('data-min') === v);
    }
  }

  function setDuration(v) {
    state.duration = v;
    renderDuration();
    render();
    save();
    if (state.start !== null && state.stopped === null) scheduleEndNotification(false); // new end time
  }

  // ---------- Events ----------
  startBtn.addEventListener('click', function () {
    if (state.start !== null && state.stopped === null) {
      stopBreak(Date.now());
      render();
      tourAfterAction();
      return;
    }
    // Untouched wheel means "now", to the second.
    state.start = wheelTouched ? wheelTime() : Date.now();
    state.stopped = null;
    wheelTouched = true; // wheel now shows this break's start
    setWheel(state.start);
    render();
    save();
    scheduleEndNotification(true); // inside the tap, so the permission prompt is allowed
    tourAfterAction();
  });

  // Cancel: throw the current break away (no summary) and go back to the defaults screen.
  function clearBreak() {
    cancelEndNotification();
    state.start = null;
    state.stopped = null;
    wheelTouched = false; // wheel follows the clock again
    lastMinute = -1;
    save();
    render();
  }
  $('cancelBtn').addEventListener('click', function () {
    var running = state.start !== null && state.stopped === null;
    if (running && !window.confirm('Cancel this break? The timer will be cleared.')) return;
    clearBreak();
  });

  $('nowBtn').addEventListener('click', function () {
    // Back to "now": the wheel jumps to the clock and Start uses the exact current second.
    wheelTouched = false;
    lastMinute = Math.floor(Date.now() / MIN);
    setWheel(Date.now());
    render();
  });

  durationInput.addEventListener('input', function () { setDuration(parseInt(durationInput.value, 10)); });

  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener('click', function () { setDuration(+this.getAttribute('data-min')); });
  }

  autoStopToggle.addEventListener('change', function () {
    render();
  });

  // ---------- End-of-break notification ----------
  // The phone stops web apps in the background, so the push server (push-server/, a Cloudflare
  // Worker) sends a notification at the break's end time. Start schedules it, Stop/Cancel cancel
  // it; a quiet "On break until …" notification sits in the shade meanwhile.
  var PUSH_SERVER = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? 'http://127.0.0.1:8790' : 'https://csbreak-push.m-abonnoor.workers.dev';
  var VAPID_PUBLIC_KEY = 'BMpcScvPYzzA2iQYjGFQ6oDrSrLrTScFlY8kdpjH7T_H5mOCaRB1GeZ1nbXH62QvX4MD4TpZrlG1SR5biV6k-o0';
  var pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window &&
    /^https?:$/.test(location.protocol);
  var notifyToggle = $('notifyToggle');

  function deviceId() {
    var id = readStore('breakCalc.deviceId');
    if (!id) {
      var bytes = crypto.getRandomValues(new Uint8Array(18));
      id = btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      writeStore('breakCalc.deviceId', id);
    }
    return id;
  }

  function b64urlToBytes(str) {
    var bin = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function updateNotifyRow() {
    $('notifyRow').hidden = !pushSupported;
    if (!pushSupported) return;
    var blocked = Notification.permission === 'denied';
    notifyToggle.disabled = blocked;
    if (blocked) notifyToggle.checked = false;
    $('notifyLabel').textContent = blocked
      ? 'Notifications are blocked for this site in your phone settings'
      : 'Notify me when it ends, even with the screen off';
  }

  function closeBreakNotifications() {
    if (!pushSupported) return;
    navigator.serviceWorker.ready.then(function (reg) {
      return reg.getNotifications({ tag: 'break' });
    }).then(function (list) { list.forEach(function (n) { n.close(); }); }).catch(function () {});
  }

  // allowPrompt: true only when called straight from a tap (browsers ignore prompts otherwise).
  function scheduleEndNotification(allowPrompt) {
    if (!pushSupported || !notifyToggle.checked || !$('tour').hidden) return; // the tour's practice break stays local
    if (state.start === null || state.stopped !== null) return;
    var total = state.duration * MIN;
    var endAt = state.start + total;
    var leads = warningLeads(state.duration);
    // One notification at each warning point and one at the end; points already passed are skipped.
    var notifications = [
      // ttl: a reminder that can't be delivered before the break ends is dropped instead of arriving late.
      { at: endAt - leads.caution, title: '⏳ ' + fmtRemaining(leads.caution) + ' left on your break',
        body: 'Back at ' + hhmm(endAt) + '.', ttl: leads.caution / 1000 },
      { at: endAt - leads.warn, title: '⚠️ Almost time: ' + fmtRemaining(leads.warn) + ' left',
        body: 'Start heading back. Due at ' + hhmm(endAt) + '.', ttl: leads.warn / 1000, urgent: true },
      { at: endAt, title: "Break's over ☕", body: 'Time to head back to your desk.', ttl: 600, urgent: true }
    ].filter(function (n) { return n.at > Date.now() + 1000; });
    if (!notifications.length) return;
    var perm = Notification.permission === 'default' && allowPrompt
      ? Notification.requestPermission() : Promise.resolve(Notification.permission);
    Promise.resolve(perm).then(function (p) {
      updateNotifyRow();
      if (p !== 'granted') return;
      return navigator.serviceWorker.ready.then(function (reg) {
        return reg.pushManager.getSubscription().then(function (sub) {
          return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(VAPID_PUBLIC_KEY) });
        }).then(function (sub) {
          reg.showNotification('On break until ' + hhmm(endAt), {
            tag: 'break', silent: true, icon: 'icons/icon-192.png',
            body: "We'll remind you as the end gets close."
          });
          return fetch(PUSH_SERVER + '/schedule', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: deviceId(), subscription: sub.toJSON(), notifications: notifications })
          });
        });
      });
    }).catch(function () {}); // no network or no push support: the in-app alarm still works when open
  }

  function cancelEndNotification() {
    if (!pushSupported || !readStore('breakCalc.deviceId')) return;
    closeBreakNotifications();
    fetch(PUSH_SERVER + '/cancel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ id: deviceId() })
    }).catch(function () {});
  }

  // Notifications will reach this phone (supported, allowed, and the option is on).
  function notificationsOn() {
    return pushSupported && notifyToggle.checked && Notification.permission === 'granted';
  }

  notifyToggle.addEventListener('change', function () {
    if (notifyToggle.checked) scheduleEndNotification(true);
    else cancelEndNotification();
  });
  updateNotifyRow();

  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });

  // ---------- Theme ----------
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function applyTheme(dark) {
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    themeMeta.setAttribute('content', dark ? '#1b1c20' : '#eef0f4');
    $('themeBtn').setAttribute('aria-pressed', dark ? 'true' : 'false');
    $('themeBtn').setAttribute('aria-label', dark ? 'Light mode' : 'Dark mode');
  }
  $('themeBtn').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    applyTheme(dark);
    writeStore('breakCalc.theme', dark ? 'dark' : 'light');
  });

  // Until the user picks a theme, follow the system and react when it changes.
  if (window.matchMedia) {
    var systemDark = matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function (e) { if (!readStore('breakCalc.theme')) applyTheme(e.matches); };
    if (systemDark.addEventListener) systemDark.addEventListener('change', onSystemChange);
    else if (systemDark.addListener) systemDark.addListener(onSystemChange);
  }

  // ---------- Init ----------
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark');
  $('year').textContent = new Date().getFullYear();
  // Auto-stop starts checked on every load; unchecking applies until the next refresh.
  autoStopToggle.checked = true;
  // Data saved by older versions (settings and the removed break history).
  removeStore('breakCalc.save');
  removeStore('breakCalc.autoStop');
  removeStore('breakCalc.history');
  // Only a break that is still running survives a refresh; otherwise start from the defaults.
  var saved = load();
  state = (saved && saved.start !== null && saved.stopped === null) ? saved : { duration: 15, start: null, stopped: null };
  if (state.start !== null) { wheelTouched = true; setWheel(state.start); }
  renderDuration();
  render();
  setInterval(render, 1000);

  // ---------- Walkthrough ----------
  // Spotlights one part of the screen at a time. On a fresh screen it is hands-on: the user taps
  // Start Break and Stop Break themselves (that practice break is cleared at the end). Opens on the
  // first visit; the ? button replays it. Steps whose target isn't on screen are skipped.
  var TOUR_KEY = 'breakCalc.tourDone';
  var INSTALL_TEXT_IOS = 'Tap ⬇ for the steps: in Safari, Share → Add to Home Screen. Then it opens like an app and works with no internet.';
  var INSTALL_TEXT = 'Tap ⬇ to add it to your home screen. It opens like an app, and once installed it works with no internet.';
  var tourIndex = 0;
  var tourSteps = [];
  var tourPractice = false; // the tour started a break that should be cleared at the end

  function buildTourSteps() {
    var hands = state.start === null; // only walk through start/stop on a clean screen
    var steps = [
      { targets: ['quickBlock', 'sliderBlock'], title: 'Pick your break length',
        text: 'Tap a quick option, or slide for an exact number of minutes.' },
      { targets: ['timeBlock'], title: 'When did it start?',
        text: 'The wheel follows the clock, so you can just start now. Took your break a bit earlier? Scroll to that time. Now jumps back to the current time.' }
    ];
    if (hands) {
      steps.push(
        { targets: ['startBtn'], waitFor: 'start', title: 'Try it: start a break',
          text: 'Tap Start Break to see it in action.' },
        { targets: ['track', 'ringTimes'], noBack: true, title: 'It\'s counting down',
          text: 'Watch the seconds tick. It turns orange when it\'s time to wrap up and red when it\'s time to head back, with a notification at each point and at the end.' },
        { targets: ['startBtn'], waitFor: 'stop', noBack: true, title: 'Now stop it',
          text: 'Back at your desk? Tap Stop Break.' },
        { targets: ['statusRow', 'summary', 'track'], noBack: true, title: 'Stopped',
          text: 'It shows how long you took and how much time was left. Start New Break begins a fresh one, and Cancel clears it.' });
    } else {
      steps.push(
        { targets: ['actionRow'], title: 'Start and stop',
          text: 'Start Break starts the timer. While it runs, Stop Break ends it and tells you how long you took; Cancel throws it away.' },
        { targets: ['track'], title: 'Watch the countdown',
          text: 'It turns orange when it\'s time to wrap up and red when it\'s time to head back, with a notification at each point and at the end.' });
    }
    steps.push(
      { targets: ['autoStopRow'], title: 'Auto-stop',
        text: 'On: the timer stops by itself at the end. Off: it keeps counting so you see how late you are.' },
      { targets: ['themeBtn', 'helpBtn'], title: 'Light or dark',
        text: 'Switch between light and dark mode, and replay this guide anytime with ?.' },
      { targets: ['installCorner'], always: true, title: 'Install it, use it offline',
        text: isInstalled ? 'You\'ve installed it, so it opens from your home screen and works with no internet.'
          : !$('installCorner').hidden ? (isIOS ? INSTALL_TEXT_IOS : INSTALL_TEXT)
          : 'Add it to your home screen from your browser menu (Add to Home screen / Install app). It opens like an app and works with no internet.' });
    return steps.filter(function (st) { return st.always || tourRect(st); });
  }

  function visible(el) { return el && !el.hidden && el.offsetParent !== null; }

  function tourRect(step) {
    var r = null;
    step.targets.forEach(function (id) {
      var el = $(id);
      if (!visible(el)) return;
      var b = el.getBoundingClientRect();
      r = r ? { top: Math.min(r.top, b.top), left: Math.min(r.left, b.left), bottom: Math.max(r.bottom, b.bottom), right: Math.max(r.right, b.right) }
            : { top: b.top, left: b.left, bottom: b.bottom, right: b.right };
    });
    return r;
  }

  function placeBox(id, top, left, width, height) {
    var st = $(id).style;
    st.top = top + 'px'; st.left = left + 'px';
    st.width = Math.max(0, width) + 'px'; st.height = Math.max(0, height) + 'px';
  }

  function placeTour() {
    var step = tourSteps[tourIndex];
    var r = tourRect(step);
    var pad = 8, W = window.innerWidth, H = window.innerHeight;
    if (!r) {
      // Nothing to point at: dim everything and center the card.
      placeBox('tourSpot', H / 2, W / 2, 0, 0);
      placeBox('tourBlockTop', 0, 0, W, H);
      ['tourBlockBottom', 'tourBlockLeft', 'tourBlockRight', 'tourBlockHole'].forEach(function (id) { placeBox(id, 0, 0, 0, 0); });
      $('tourCard').style.top = Math.max(12, (H - $('tourCard').offsetHeight) / 2) + 'px';
      return;
    }
    var t = r.top - pad, l = r.left - pad, w = r.right - r.left + pad * 2, h = r.bottom - r.top + pad * 2;
    placeBox('tourSpot', t, l, w, h);
    placeBox('tourBlockTop', 0, 0, W, t);
    placeBox('tourBlockBottom', t + h, 0, W, H - t - h);
    placeBox('tourBlockLeft', t, 0, l, h);
    placeBox('tourBlockRight', t, l + w, W - l - w, h);
    placeBox('tourBlockHole', t, l, w, h);
    // Card below the spotlight if it fits, otherwise above it.
    var card = $('tourCard');
    var ch = card.offsetHeight;
    var below = t + h + 12;
    var cardBelow = below + ch <= H - 12;
    card.style.top = (cardBelow ? below : Math.max(12, t - 12 - ch)) + 'px';
    // Point the hint at the button: up when the card sits under it, down when above.
    $('tourHint').textContent = 'Tap the highlighted button ' + (cardBelow ? '👆' : '👇');
  }

  function showTourStep(i) {
    tourIndex = i;
    var step = tourSteps[i];
    $('tourStep').textContent = (i + 1) + ' / ' + tourSteps.length;
    $('tourTitle').textContent = step.title;
    $('tourText').textContent = step.text;
    $('tourBack').hidden = i === 0 || !!step.noBack || !!step.waitFor;
    $('tourNext').hidden = !!step.waitFor;         // hands-on steps advance when the user taps the button
    $('tourHint').hidden = !step.waitFor;
    $('tourBlockHole').hidden = !!step.waitFor;     // hands-on steps: let taps through to the highlighted button
    $('tourNext').textContent = i === tourSteps.length - 1 ? 'Done' : 'Next';
    // Bring the part into view first, then measure where it landed.
    var first = step.targets.filter(function (id) { return visible($(id)); })[0];
    if (first) $(first).scrollIntoView({ block: 'center' });
    placeTour();
    (step.waitFor ? $(step.targets[0]) : $('tourNext')).focus();
  }

  // Called after Start/Stop; moves a hands-on step forward once the user did what it asked.
  function tourAfterAction() {
    if ($('tour').hidden) return;
    var step = tourSteps[tourIndex];
    var running = state.start !== null && state.stopped === null;
    if (step.waitFor === 'start' && running) { tourPractice = true; showTourStep(tourIndex + 1); }
    else if (step.waitFor === 'stop' && !running) showTourStep(tourIndex + 1);
  }

  function startTour() {
    tourSteps = buildTourSteps();
    if (!tourSteps.length) return;
    tourPractice = false;
    hideInstall();
    $('tour').hidden = false;
    showTourStep(0);
  }

  function endTour() {
    $('tour').hidden = true;
    writeStore(TOUR_KEY, '1');
    if (tourPractice) clearBreak(); // don't leave the practice break behind
    tourPractice = false;
    window.scrollTo(0, 0);
    $('helpBtn').focus();
  }

  $('helpBtn').addEventListener('click', startTour);
  $('tourNext').addEventListener('click', function () {
    if (tourIndex < tourSteps.length - 1) showTourStep(tourIndex + 1);
    else endTour();
  });
  $('tourBack').addEventListener('click', function () { if (tourIndex > 0) showTourStep(tourIndex - 1); });
  $('tourSkip').addEventListener('click', endTour);
  document.addEventListener('keydown', function (e) {
    if ($('tour').hidden) return;
    if (e.key === 'Escape') endTour();
    else if (e.key === 'ArrowRight' && !$('tourNext').hidden) $('tourNext').click();
    else if (e.key === 'ArrowLeft' && !$('tourBack').hidden) $('tourBack').click();
  });
  window.addEventListener('resize', function () { if (!$('tour').hidden) placeTour(); });

  // ---------- Install banner ----------
  // Android/desktop Chrome: our own Install button triggers the browser's install dialog.
  // iPhone/iPad: there is no install API, so the banner explains Share → Add to Home Screen.
  // It shows by itself on up to INSTALL_MAX_SHOWS visits (closing it only hides it for that visit),
  // never once installed. The install button in the top-right corner brings it back any time.
  var INSTALL_SHOWS_KEY = 'breakCalc.installShows';
  var INSTALL_MAX_SHOWS = 5;
  var shownThisVisit = false;
  removeStore('breakCalc.installDismissed'); // replaced by the visit count
  var installBar = $('installBar');
  var installEvent = null;
  var isInstalled = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports as a Mac
  var canInstall = /^https?:$/.test(location.protocol);
  function updateInstallCorner() {
    $('installCorner').hidden = !canInstall || isInstalled || !(installEvent || isIOS);
  }
  function showInstall(mode, force) {
    if (isInstalled) return;
    if (!force && !shownThisVisit) {
      // Count each visit the banner appears on by itself; stop after the limit.
      var shows = +readStore(INSTALL_SHOWS_KEY) || 0;
      if (shows >= INSTALL_MAX_SHOWS) return;
      writeStore(INSTALL_SHOWS_KEY, String(shows + 1));
      shownThisVisit = true;
    }
    $('installBtn').hidden = mode !== 'prompt';
    if (mode !== 'ios') {
      $('installHint').textContent = 'Opens like an app and works offline.';
    } else {
      $('installHint').innerHTML = 'Tap <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 15V3"/><polyline points="8 7 12 3 16 7"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> Share, then <b>Add to Home Screen</b>.';
    }
    installBar.hidden = false;
  }
  function hideInstall() {
    installBar.hidden = true;
  }
  if (canInstall) {
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); // show our banner instead of the browser's default one
      installEvent = e;
      showInstall('prompt');
      updateInstallCorner();
    });
    if (isIOS) showInstall('ios');
  }
  function promptInstall() {
    if (!installEvent) return;
    installEvent.prompt();
    installEvent.userChoice.then(function (choice) {
      installEvent = null; // the browser offers it again later if still not installed
      hideInstall();
      updateInstallCorner();
    });
  }
  $('installBtn').addEventListener('click', promptInstall);
  $('installCorner').addEventListener('click', function () {
    if (installEvent) promptInstall();
    else if (isIOS) showInstall('ios', true); // iPhone: show the Share → Add to Home Screen steps
  });
  updateInstallCorner();
  $('installClose').addEventListener('click', hideInstall);
  window.addEventListener('appinstalled', function () { isInstalled = true; hideInstall(); updateInstallCorner(); });

  if (!readStore(TOUR_KEY)) setTimeout(startTour, 400);

  // Offline + installable: service workers only run over http(s), not when opened as a file.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
